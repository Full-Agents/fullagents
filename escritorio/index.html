<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f6f4}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Escritório Full Agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --fundo:#E9ECE6; --painel:#F7F8F4; --tinta:#17231F; --tinta-2:#4E5D57; --linha:#D3D9D1; --realce:#1F7A64;
  --cena:#DCE2DA;
  --lendo:#2F74B5; --escrevendo:#C9861A; --alerta:#C8433A; --relatorio:#2E8F57; --parado:#8A968F;
  --chip-fundo:#EEF1EB;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fundo:#111816; --painel:#18211E; --tinta:#E6ECE7; --tinta-2:#9FB0A8; --linha:#2A3632; --realce:#4FC4A2;
    --cena:#1B2522; --lendo:#5B9BD8; --escrevendo:#E2A33D; --alerta:#E4685E; --relatorio:#52B97C; --parado:#7E8C86;
    --chip-fundo:#212C28; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --fundo:#111816; --painel:#18211E; --tinta:#E6ECE7; --tinta-2:#9FB0A8; --linha:#2A3632; --realce:#4FC4A2;
  --cena:#1B2522; --lendo:#5B9BD8; --escrevendo:#E2A33D; --alerta:#E4685E; --relatorio:#52B97C; --parado:#7E8C86;
  --chip-fundo:#212C28; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--fundo);color:var(--tinta);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 360px;}
.cena{position:relative;min-height:0;background:var(--cena);overflow:hidden}
.cena canvas{display:block;width:100%;height:100%;touch-action:none}
.topo{position:absolute;left:16px;top:14px;right:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:none}
.marca{font:700 20px/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em;pointer-events:auto}
.selo{font:500 11px/1 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.08em;padding:5px 8px;border-radius:4px;background:var(--painel);border:1px solid var(--linha);color:var(--tinta-2)}
.selo{display:inline-flex;align-items:center;gap:6px}
.vivo{width:7px;height:7px;border-radius:50%;background:var(--alerta);animation:pisca 1.6s infinite}
@keyframes pisca{50%{opacity:.25}}
.flutua{pointer-events:auto;padding:6px 9px;font-size:12px;background:var(--painel)}
.relogio{margin-left:auto;font:500 13px/1 "IBM Plex Mono",monospace;background:var(--painel);border:1px solid var(--linha);padding:6px 9px;border-radius:4px;font-variant-numeric:tabular-nums}
.rotulos{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:3px;white-space:nowrap}
.tag .nome{font:600 11px/1 "IBM Plex Sans",sans-serif;background:var(--painel);color:var(--tinta);border:1px solid var(--linha);padding:3px 6px 3px 5px;border-radius:10px;display:flex;align-items:center;gap:5px;box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.tag .ponto{width:7px;height:7px;border-radius:50%;background:var(--parado)}
.tag .balao{font:400 11px/1.3 "IBM Plex Sans",sans-serif;background:var(--tinta);color:var(--painel);padding:4px 7px;border-radius:6px;max-width:190px;white-space:normal;text-align:center}
.tag .excl{font:700 13px/1 "IBM Plex Sans",sans-serif;color:#fff;background:var(--alerta);width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.tag.sel .nome{border-color:var(--realce);box-shadow:0 0 0 2px var(--realce)}
.legenda{position:absolute;left:16px;bottom:14px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.legenda span{display:flex;align-items:center;gap:5px;font-size:11px;background:var(--painel);border:1px solid var(--linha);border-radius:10px;padding:3px 8px;color:var(--tinta-2)}
.legenda i{width:8px;height:8px;border-radius:50%}

.lado{background:var(--painel);border-left:1px solid var(--linha);display:flex;flex-direction:column;min-height:0}
.lado section{padding-inline:16px;padding-block:14px;border-bottom:1px solid var(--linha)}
.lado h2{font:700 15px/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 10px}
.controles{display:flex;gap:8px;flex-wrap:wrap}
button{font:500 13px/1 "IBM Plex Sans",sans-serif;padding:8px 11px;border-radius:6px;border:1px solid var(--linha);background:var(--fundo);color:var(--tinta);cursor:pointer}
button:hover{border-color:var(--tinta-2)}
button:focus-visible{outline:2px solid var(--realce);outline-offset:2px}
button.forte{background:var(--realce);border-color:var(--realce);color:#fff}
.numeros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.numeros div{border:1px solid var(--linha);border-radius:6px;padding:7px 8px}
.numeros b{display:block;font:600 18px/1.1 "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.numeros small{font-size:11px;color:var(--tinta-2)}
.ficha .vazio{color:var(--tinta-2);margin:0}
.ficha dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:13px}
.ficha dt{color:var(--tinta-2)} .ficha dd{margin:0}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 11px/1 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.05em;padding:4px 7px;border-radius:4px;background:var(--chip-fundo)}
.chip i{width:7px;height:7px;border-radius:50%}
.decidir ul,.feed ul{list-style:none;margin:0;padding:0}
.decidir li{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--linha);font-size:13px}
.decidir li:first-child{border-top:0}
.decidir li span{flex:1}
.decidir li button{padding:5px 8px;font-size:12px}
.decidir .vazio{color:var(--tinta-2);margin:0;font-size:13px}
.feed{flex:1;min-height:0;display:flex;flex-direction:column}
.feed ul{overflow:auto;flex:1;min-height:0}
.feed li{display:grid;grid-template-columns:44px 1fr;gap:2px 8px;padding:7px 0;border-top:1px solid var(--linha);font-size:12.5px}
.feed li time{font:500 11.5px/1.5 "IBM Plex Mono",monospace;color:var(--tinta-2);font-variant-numeric:tabular-nums}
.feed li b{font-weight:600}
.feed li .t{grid-column:2;color:var(--tinta-2)}
.feed li.escrevendo .t{color:var(--escrevendo)} .feed li.alerta .t{color:var(--alerta)} .feed li.relatorio .t{color:var(--relatorio)}
.reuniao{border:1px solid var(--realce);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13px}
.reuniao ol{margin:6px 0 0;padding-left:18px}
.reuniao li{margin:3px 0}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}
  .lado{border-left:0;border-top:1px solid var(--linha)}
  .feed ul{max-height:340px}
  .tag .balao{max-width:140px}
}
@media (prefers-reduced-motion: reduce){ .vivo{animation:none} }
</style>

<div class="app">
  <div class="cena" id="cena">
    <div class="rotulos" id="rotulos"></div>
    <div class="topo">
      <span class="marca">Escritório Full Agents</span>
      <span class="selo"><i class="vivo"></i>Ao vivo · dados de exemplo</span>
      <span class="relogio" id="relogio">--:--</span>
      <button id="bTudo" class="flutua" type="button">Ver o escritório todo</button>
    </div>
    <div class="legenda" id="legenda"></div>
  </div>

  <aside class="lado">
    <section>
      <h2>Controle</h2>
      <div class="controles">
        <button id="bPausa" type="button">Pausar</button>
        <button id="bVel" type="button">Ritmo 1×</button>
        <button id="bReuniao" class="forte" type="button">Reunião diária</button>
      </div>
      <div class="numeros">
        <div><b id="nAtivos">0</b><small>trabalhando</small></div>
        <div><b id="nEscrita">0</b><small>escritas na conta</small></div>
        <div><b id="nDecidir">0</b><small>para você</small></div>
        <div><b id="nRel">0</b><small>relatórios</small></div>
      </div>
      <div id="reuniao"></div>
    </section>
    <section class="ficha" id="ficha">
      <h2>Agente</h2>
      <p class="vazio">Toque num boneco para ver o que ele está fazendo.</p>
    </section>
    <section class="decidir">
      <h2>Para você decidir</h2>
      <ul id="decidir"></ul>
    </section>
    <section class="feed">
      <h2>O que aconteceu</h2>
      <ul id="feed"></ul>
    </section>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";

// ================= dados =================
const TIMES = {
  produto:{nome:"Produto", cor:0x2F7D6D},
  vendas:{nome:"Vendas", cor:0xB8683A},
  atendimento:{nome:"Atendimento", cor:0x6456B8},
  operacao:{nome:"Operação", cor:0x44698C}
};
const AGENTES = [
  {id:"garimpador", nome:"Garimpador de Fornecedores", curto:"Garimpador", time:"produto", mesa:[-13,-8]},
  {id:"viabilizador", nome:"Viabilizador de Produtos", curto:"Viabilizador", time:"produto", mesa:[-9,-8]},
  {id:"catalogo", nome:"Gestor de Catálogo", curto:"Catálogo", time:"produto", mesa:[-13,-4]},
  {id:"criador", nome:"Criador de Anúncios", curto:"Criador", time:"produto", mesa:[-9,-4]},
  {id:"ads", nome:"Gestor de Ads", curto:"Ads", time:"vendas", mesa:[-3,-8]},
  {id:"promocoes", nome:"Gestor de Promoções", curto:"Promoções", time:"vendas", mesa:[1,-8]},
  {id:"concorrencia", nome:"Analista de Concorrência", curto:"Concorrência", time:"vendas", mesa:[-3,-4]},
  {id:"perguntas", nome:"Respondedor de Perguntas", curto:"Perguntas", time:"atendimento", mesa:[-13,4]},
  {id:"reclamacoes", nome:"Atendente de Reclamações", curto:"Reclamações", time:"atendimento", mesa:[-9,4]},
  {id:"retirada", nome:"Retirada Full", curto:"Retirada Full", time:"operacao", mesa:[-3,4]},
  {id:"vigia", nome:"Vigia", curto:"Vigia", time:"operacao", mesa:[1,4]}
];
// Passos: [tipo, texto, segundos | colega]. Tipos: lendo, escrevendo, alerta, relatorio, passar.
const ROTEIROS = {
  garimpador:[["lendo","Busca pública: limitador de grama, 48 anúncios",4],["lendo","Visitas de 30 dias dos 20 primeiros",4],["lendo","CNPJ de 3 fornecedores na Receita",3],["relatorio","3 fornecedores lidos, 1 verde a R$ 1,02/m"],["passar","Fornecedor verde: montar título e ficha","criador"]],
  viabilizador:[["lendo","Busca pública: 3.083 resultados, 58% internacionais",4],["lendo","Avaliações datadas do catálogo líder",4],["lendo","Tarifa 11,5% e frete R$ 8,25 no simulador",3],["alerta","Confirmar se o produto exige INMETRO",3],["relatorio","Testar com condições, teto de custo R$ 31,74"],["passar","Produto aprovado: cotar com fornecedores","garimpador"]],
  catalogo:[["lendo","42 anúncios da conta",3],["lendo","Buy box de 12 catálogos",4],["relatorio","3 catálogos perdendo buy box por R$ 0,40"]],
  criador:[["lendo","Top 5 anúncios por visitas (3 lista, 2 catálogo)",4],["lendo","Ficha técnica da categoria",3],["escrevendo","Anúncio criado pausado, aguardando fotos",3],["relatorio","3 títulos de teste, preço de criação R$ 57,39"]],
  ads:[["lendo","ROAS de 30 dias em 9 campanhas",4],["alerta","Campanha de aspirador abaixo da margem mínima",3],["relatorio","2 campanhas para pausar, 1 para subir verba"]],
  promocoes:[["lendo","18 promoções disponíveis",3],["lendo","Margem de cada anúncio em cada promoção",4],["escrevendo","Entrou em 6 promoções acima da margem",3],["relatorio","6 promoções aceitas, 12 recusadas pela margem"]],
  concorrencia:[["lendo","12 concorrentes monitorados",4],["lendo","Concorrente baixou preço em 8%",3],["relatorio","3 mudanças de preço, 1 anúncio novo"],["passar","Concorrente baixou 8%: rever promoções","promocoes"]],
  perguntas:[["lendo","5 perguntas sem resposta",3],["escrevendo","3 perguntas respondidas com a ficha",3],["alerta","2 perguntas pedem decisão: desconto e nota fiscal",3],["relatorio","3 respondidas, 2 esperando você"]],
  reclamacoes:[["lendo","2 reclamações abertas",3],["escrevendo","Orientação enviada na reclamação de voltagem",3],["alerta","1 reclamação pede reembolso: decidir",3],["relatorio","1 orientada, 1 esperando você"]],
  retirada:[["lendo","Agendada para 28/09 às 08:00",3],["lendo","4 unidades para evitar descarte",3],["lendo","Tarifa conferida: R$ 0,00",2],["escrevendo","Retirada confirmada sem custo",3],["relatorio","4 unidades retiradas, tarifa R$ 0"]],
  vigia:[["lendo","Conferindo as execuções de hoje",4],["lendo","10 agentes rodaram, nenhum travado",3],["relatorio","Tudo em dia: 0 falhas nas últimas 24 h"]]
};
const CLIENTES = ["BETAHOME","BETAHOME","Loja de carros"];
const ESTADOS = {
  parado:{nome:"Parado", var:"--parado"},
  andando:{nome:"Andando", var:"--parado"},
  lendo:{nome:"Lendo", var:"--lendo"},
  escrevendo:{nome:"Escrevendo na conta", var:"--escrevendo"},
  alerta:{nome:"Precisa de você", var:"--alerta"},
  relatorio:{nome:"Entregando relatório", var:"--relatorio"},
  passar:{nome:"Passando trabalho", var:"--relatorio"},
  reuniao:{nome:"Em reunião", var:"--realce"}
};
// Ao vivo: cada acontecimento fica na tela pelo menos este tempo, mesmo que o agente termine antes.
const MIN_VISIVEL_S = 4;
const cor = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const reduzido = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ================= cena =================
const cenaEl = document.getElementById("cena");
const rotulosEl = document.getElementById("rotulos");
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
cenaEl.prepend(renderer.domElement);
const scene = new THREE.Scene();
let corDia = new THREE.Color(cor("--cena"));
const corNoite = new THREE.Color(0x0C1311);
function lerTema(){ corDia = new THREE.Color(cor("--cena")); }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", lerTema);
new MutationObserver(lerTema).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
scene.background = corDia.clone();

const camera = new THREE.PerspectiveCamera(38,1,0.5,300);
const ALVO_INICIAL = new THREE.Vector3(-1,0,-1);
camera.position.set(-2,30,28);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.copy(ALVO_INICIAL);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI*0.44;
controls.minDistance = 6; controls.maxDistance = 110;
controls.update();
let OFFSET_INICIAL = camera.position.clone().sub(ALVO_INICIAL);

const ceu = new THREE.HemisphereLight(0xffffff,0x9aa39c,0.75);
scene.add(ceu);
const sol = new THREE.DirectionalLight(0xffffff,0.75);
sol.position.set(-12,26,14);
sol.castShadow = true;
sol.shadow.mapSize.set(1024,1024);
Object.assign(sol.shadow.camera,{left:-22,right:22,top:18,bottom:-18,near:1,far:70});
scene.add(sol);
const luzSala = new THREE.PointLight(0xFFD9A0,0,9); luzSala.position.set(13,2.6,7.4); scene.add(luzSala);

const mat = c => new THREE.MeshStandardMaterial({color:c, roughness:0.85, metalness:0});
function caixa(w,h,d,c,x,y,z,sombra=true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(c));
  m.position.set(x,y,z); m.castShadow = sombra; m.receiveShadow = true; scene.add(m); return m;
}
function textura(texto, cCor, larg=512, alt=128, fonte="700 64px 'Bricolage Grotesque', sans-serif"){
  const c = document.createElement("canvas"); c.width=larg; c.height=alt;
  const g = c.getContext("2d"); g.fillStyle=cCor; g.font=fonte; g.textAlign="center"; g.textBaseline="middle";
  g.fillText(texto, larg/2, alt/2);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
function rotuloChao(texto, hex, x, z){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(4,1), new THREE.MeshBasicMaterial({map:textura(texto,hex), transparent:true}));
  m.rotation.x = -Math.PI/2; m.position.set(x,0.02,z); scene.add(m);
}
function tapete(geo, c, op, x, z){
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color:c, transparent:true, opacity:op}));
  m.rotation.x = -Math.PI/2; m.position.set(x,0.01,z); m.receiveShadow = true; scene.add(m);
}

// telas: uma imagem por tipo de trabalho
function telaCanvas(desenho, alt=80){
  const c = document.createElement("canvas"); c.width = 128; c.height = alt;
  desenho(c.getContext("2d"));
  const t = new THREE.CanvasTexture(c); return t;
}
const TELAS = {
  parado: telaCanvas(g=>{ g.fillStyle="#1D2623"; g.fillRect(0,0,128,80); g.fillStyle="#3E6F61"; g.font="700 20px sans-serif"; g.textAlign="center"; g.fillText("FA",64,48); }),
  lendo: telaCanvas(g=>{ g.fillStyle="#EAF1F8"; g.fillRect(0,0,128,80); for(let i=0;i<16;i++){ g.fillStyle=i%3===0?"#2F74B5":"#9DB3C8"; g.fillRect(8,4+i*8,30+((i*37)%70),4); g.fillStyle="#C9D6E2"; g.fillRect(100,4+i*8,20,4);} }, 128),
  escrevendo: telaCanvas(g=>{ g.fillStyle="#FFF6E6"; g.fillRect(0,0,128,80); g.fillStyle="#C9861A"; g.fillRect(0,0,128,14); g.fillStyle="#D9B77A"; for(let i=0;i<5;i++) g.fillRect(10,22+i*11,60+((i*29)%50),5); g.fillStyle="#C9861A"; g.fillRect(96,64,24,10); }),
  alerta: telaCanvas(g=>{ g.fillStyle="#C8433A"; g.fillRect(0,0,128,80); g.fillStyle="#fff"; g.font="700 54px sans-serif"; g.textAlign="center"; g.fillText("!",64,60); }),
  relatorio: telaCanvas(g=>{ g.fillStyle="#E9F5EE"; g.fillRect(0,0,128,80); g.strokeStyle="#2E8F57"; g.lineWidth=8; g.beginPath(); g.moveTo(40,42); g.lineTo(58,58); g.lineTo(90,22); g.stroke(); })
};
TELAS.lendo.wrapT = THREE.RepeatWrapping;
TELAS.andando = TELAS.parado; TELAS.reuniao = TELAS.parado; TELAS.passar = TELAS.relatorio;

// chão, paredes e áreas
const chao = new THREE.Mesh(new THREE.PlaneGeometry(34,24), mat(0xD7DBD3));
chao.rotation.x = -Math.PI/2; chao.receiveShadow = true; scene.add(chao);
caixa(34,2.2,0.25,0x7E9E95,0,1.1,-12.1);
caixa(0.25,2.2,24,0x7E9E95,-17.1,1.1,0);
const hex = n => "#"+n.toString(16).padStart(6,"0");
for(const [time,x,z,w,d] of [["produto",-11,-6,8.6,7.6],["vendas",-1,-6,8.6,7.6],["atendimento",-11,4.4,8.6,4.6],["operacao",-1,4.4,8.6,4.6]]){
  tapete(new THREE.PlaneGeometry(w,d), TIMES[time].cor, 0.16, x, z);
  rotuloChao(TIMES[time].nome.toUpperCase(), hex(TIMES[time].cor), x - w/2 + 2.1, z + d/2 - 0.6);
}

function mesa(x,z){
  caixa(2.2,0.08,1.1,0xB99A74,x,0.74,z);
  for(const [dx,dz] of [[-1,-0.45],[1,-0.45],[-1,0.45],[1,0.45]]) caixa(0.06,0.72,0.06,0x5B5F5C,x+dx,0.36,z+dz,false);
  caixa(0.9,0.55,0.05,0x2A2F2D,x,1.1,z-0.35);
  const tela = new THREE.Mesh(new THREE.PlaneGeometry(0.82,0.47), new THREE.MeshBasicMaterial({map:TELAS.parado}));
  tela.position.set(x,1.1,z-0.32); scene.add(tela);
  caixa(0.08,0.3,0.08,0x2A2F2D,x,0.9,z-0.38,false);
  caixa(0.55,0.03,0.18,0x3B403E,x,0.8,z+0.05,false);
  caixa(0.6,0.08,0.6,0x39433F,x,0.46,z+0.85);

// ================= rotas pelo corredor (z = 0), sem atravessar móveis =================
function ponto(a, loc){
  if(loc.tipo==="mesa") return {x:a.mesa[0], z:a.mesa[1]+0.85};
  if(loc.tipo==="colega"){ const b = porId[loc.id]; return {x:b.mesa[0]+0.95, z:b.mesa[1]+0.85}; }
  if(loc.tipo==="entrega") return {x:11.95, z:6.3};
  const ang = angAssento(loc.i); return {x:REUNIAO.x+Math.cos(ang)*REUNIAO.rAssento, z:REUNIAO.z+Math.sin(ang)*REUNIAO.rAssento};
}
function saida(a, loc){ // do lugar até o corredor, sem o próprio lugar
  if(loc.tipo==="mesa" || loc.tipo==="colega"){ const m = loc.tipo==="mesa" ? a.mesa : porId[loc.id].mesa; const ax = m[0]+2; return [{x:ax,z:m[1]+0.85},{x:ax,z:0}]; }
  if(loc.tipo==="entrega") return [{x:8.2,z:6},{x:8.2,z:0}];
  // reunião: sai da cadeira, contorna a mesa por fora e chega à entrada (7, 0)
  const cx = REUNIAO.x, cz = REUNIAO.z, r = REUNIAO.rVolta;
  const a0 = angAssento(loc.i), a1 = Math.atan2(0-cz, 7-cx);
  let d = a1 - a0; d = ((d + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI;
  const passos = Math.max(1, Math.ceil(Math.abs(d)/0.35)), pts = [];
  for(let k=0;k<=passos;k++){ const ang = a0 + d*k/passos; pts.push({x:cx+Math.cos(ang)*r, z:cz+Math.sin(ang)*r}); }
  pts.push({x:7,z:0});
  return pts;
}
function rota(a, de, para){ return saida(a,de).concat(saida(a,para).reverse(), [ponto(a,para)]); }
function andar(a, para, aoChegar){
  a.rota = rota(a, a.local, para); a.destino = para; a.aoChegar = aoChegar;
  a.pausaAntes = a.altura < -0.1 ? 0.45 : 0; a.alturaAlvo = 0;
}
function chegou(a){
  a.local = a.destino; a.destino = null;
  const L = a.local;
  if(L.tipo==="mesa"){ a.rotAlvo = Math.PI; a.alturaAlvo = -0.18; }
  else if(L.tipo==="reuniao"){ const p = ponto(a,L); a.rotAlvo = Math.atan2(REUNIAO.x-p.x, REUNIAO.z-p.z); a.alturaAlvo = -0.18; }
  else if(L.tipo==="entrega"){ a.rotAlvo = 0; }
  else if(L.tipo==="colega"){ a.rotAlvo = -Math.PI/2; }
  const f = a.aoChegar; a.aoChegar = null; if(f) f();
}

function receberEvento(ev){

function proximo(a){
  const p = a.passos.shift();
  if(!p){ a.cliente = null; mudar(a,"parado","Esperando a próxima execução",false); a.espera = 8+Math.random()*16; return; }
  if(a.cliente!==p.cliente){ a.cliente = p.cliente; registrar(a,"lendo","Começou a execução"); }
  if(p.tipo==="relatorio"){
    a.ultimoRelatorio = p.texto;
    mudar(a,"relatorio",p.texto); registrar(a,"relatorio","Relatório: "+p.texto);

      if(pilha.length>14){ scene.remove(pilha.shift()); pilha.forEach((x,i)=>x.position.y=0.85+i*0.018); }
      relatorios++; contar();
      if(a.passos.length && a.passos[0].tipo==="passar"){ proximo(a); return; }
      andar(a,{tipo:"mesa"},()=>proximo(a));
    });
    return;
  }
  if(p.tipo==="passar"){
    const b = porId[p.colega];
    mudar(a,"passar","Levando para "+b.curto+": "+p.texto); registrar(a,"passar","Passou para "+b.curto+": "+p.texto);
    a.g.userData.folha.visible = true;
    andar(a,{tipo:"colega", id:b.id},()=>{
      a.g.userData.folha.visible = false; a.maoLevantada = 0.8; b.maoLevantada = 0.8;
      execucaoDeExemplo(b, p.cliente, "Recebeu de "+a.curto+": "+p.texto);
      andar(a,{tipo:"mesa"},()=>proximo(a));
    });

  mudar(a, p.tipo, p.texto); registrar(a, p.tipo, p.texto);
  a.restante = p.seg;
}

const aproxima = (x, alvo, k) => x + (alvo - x) * Math.min(1, k);
function posar(u, a, dt, andando){
  const trab = ["lendo","escrevendo"].includes(a.estado) && !andando;
  const sentado = a.altura < -0.1;
  const f = a.fase;
  let pe = 0, pd = 0, be = 0, bd = 0, cab = 0;
  if(andando){ pe = Math.sin(f)*0.6; pd = -pe; be = -pe*0.8; bd = pe*0.8; }
  else if(sentado){ pe = pd = -Math.PI/2; be = bd = trab ? -1.25 : -0.5; if(trab && !reduzido){ be += Math.sin(f*3.2)*0.12; bd += Math.sin(f*3.2+1.6)*0.12; cab = Math.sin(f*0.8)*0.04; } }
  if(a.folhaNaMao) bd = -0.9;
  if(a.estado==="alerta" && !andando) bd = -2.8 + Math.sin(f*2)*0.15;
  if(a.maoLevantada > 0) bd = -2.2;
  const k = dt*10;
  u.pernaE.rotation.x = aproxima(u.pernaE.rotation.x, pe, k);
  u.pernaD.rotation.x = aproxima(u.pernaD.rotation.x, pd, k);
  u.bracoE.rotation.x = aproxima(u.bracoE.rotation.x, be, k);
  u.bracoD.rotation.x = aproxima(u.bracoD.rotation.x, bd, k);
  u.cabeca.rotation.x = aproxima(u.cabeca.rotation.x, trab ? 0.18 + cab : 0, k);
}

function quadro(agora){
  requestAnimationFrame(quadro);
  const dtReal = Math.min(0.05,(agora-antes)/1000); antes = agora;
  const t = pausado ? 0 : dtReal*ritmo;
  relogioEl.textContent = agoraTxt();

  // dia e noite
  const cl = claridade();
  ceu.intensity = 0.38 + 0.37*cl; sol.intensity = 0.12 + 0.63*cl; luzSala.intensity = (1-cl)*1.1;
  scene.background.copy(corNoite).lerp(corDia, cl);

  const ativos = agentes.filter(a=>a.estado!=="parado").length;
  for(const a of agentes){
    const u = a.g.userData;
    a.folhaNaMao = u.folha.visible;
    let andando = false;
    if(a.maoLevantada > 0) a.maoLevantada -= dtReal;
    if(a.pausaAntes > 0){ a.pausaAntes -= t; if(a.rota.length){ const p = a.rota[0]; a.rotAlvo = Math.atan2(p.x-a.g.position.x, p.z-a.g.position.z); } }
    else if(a.rota.length){
      const alvo = a.rota[0], dx = alvo.x-a.g.position.x, dz = alvo.z-a.g.position.z, dist = Math.hypot(dx,dz), passo = 2.6*t;
      andando = t > 0;
      if(dist <= passo){ a.g.position.x = alvo.x; a.g.position.z = alvo.z; a.rota.shift(); if(!a.rota.length) chegou(a); }
      else { a.g.position.x += dx/dist*passo; a.g.position.z += dz/dist*passo; a.rotAlvo = Math.atan2(dx,dz); }
    } else if(!pausado && !emReuniao && a.local.tipo==="mesa"){
      if(a.estado==="parado"){
        if(a.passos.length) proximo(a);
        else { a.espera -= t; if(a.espera<=0 && ativos<7) execucaoDeExemplo(a); }
      } else if(a.restante>0){ a.restante -= t; if(a.restante<=0) proximo(a); }
    }
    a.fase += t*(andando ? 9 : 5);
    a.altura = aproxima(a.altura, a.alturaAlvo, dtReal*6);
    a.g.position.y = a.altura + (andando && !reduzido ? Math.abs(Math.sin(a.fase))*0.05 : 0);
    a.g.rotation.y += giro(a.g.rotation.y, a.rotAlvo) * Math.min(1, dtReal*8);
    posar(u, a, dtReal, andando);

    const c = new THREE.Color(cor(ESTADOS[a.estado].var));
    u.anel.material.color.copy(c);
    const mapa = a.estado==="lendo" ? a.telaLendo : TELAS[a.estado];
    if(a.tela.material.map !== mapa){ a.tela.material.map = mapa; a.tela.material.needsUpdate = true; }
    if(a.estado==="lendo") a.telaLendo.offset.y -= t*0.25;

    v3.set(a.g.position.x, a.g.position.y+1.95, a.g.position.z).project(camera);
    a.tag.style.display = v3.z < 1 ? "" : "none";
    a.tag.style.left = ((v3.x+1)/2*cenaEl.clientWidth)+"px";
    a.tag.style.top = ((1-v3.y)/2*cenaEl.clientHeight)+"px";
    a.tag.querySelector(".ponto").style.background = c.getStyle();
    a.tag.classList.toggle("sel", selecionado===a.id);
    const balao = a.tag.querySelector(".balao");
    const mostrar = (agora < a.balaoAte || selecionado===a.id) && !["parado","reuniao","andando"].includes(a.estado);
    const texto = (a.cliente ? a.cliente + " · " : "") + a.texto;
    if(mostrar && balao.textContent!==texto) balao.textContent = texto;
    balao.hidden = !mostrar;
    a.tag.querySelector(".excl").hidden = !a.alerta;
  }

  // você: sentado, digitando de leve; levanta a mão quando chega relatório ou quando marca "Visto"
  vc.fase += dtReal*3; if(vc.maoLevantada > 0) vc.maoLevantada -= dtReal;
  const uv = voce.userData; voce.position.y = -0.18;
  uv.pernaE.rotation.x = uv.pernaD.rotation.x = -Math.PI/2;
  uv.bracoE.rotation.x = -0.9;
  uv.bracoD.rotation.x = aproxima(uv.bracoD.rotation.x, vc.maoLevantada > 0 ? -2.3 : -0.9 + (reduzido?0:Math.sin(vc.fase)*0.06), dtReal*8);
  v3.set(voce.position.x, 1.75, voce.position.z).project(camera);
  tagVoce.style.left = ((v3.x+1)/2*cenaEl.clientWidth)+"px"; tagVoce.style.top = ((1-v3.y)/2*cenaEl.clientHeight)+"px";

  // câmera: segue o agente escolhido e se aproxima; "Ver o escritório todo" volta à visão geral
  if(seguir && selecionado){
    const g = porId[selecionado].g;
    alvoTmp.set(g.position.x, 0.8, g.position.z);
    const offset = camera.position.clone().sub(controls.target);
    controls.target.lerp(alvoTmp, Math.min(1, dtReal*3));
    if(aproximar && offset.length() > 13) offset.multiplyScalar(1 - Math.min(0.9, dtReal*1.8));
    camera.position.copy(controls.target).add(offset);
  } else if(voltarVisao){
    controls.target.lerp(ALVO_INICIAL, Math.min(1, dtReal*3));
    const offset = camera.position.clone().sub(controls.target);
    offset.lerp(OFFSET_INICIAL, Math.min(1, dtReal*3));
    camera.position.copy(controls.target).add(offset);
    if(controls.target.distanceTo(ALVO_INICIAL) < 0.05 && offset.distanceTo(OFFSET_INICIAL) < 0.1) voltarVisao = false;
  }
  controls.update();
  renderer.render(scene,camera);
}

// o dia já começou: alguns agentes trabalhando e relatórios na mesa
desenharDecidir(); contar();
["perguntas","promocoes","viabilizador","retirada"].forEach((id,i)=>{ porId[id].espera = 0.3+i*0.8; });
porId.vigia.ultimoRelatorio = "Tudo em dia: 0 falhas nas últimas 24 h";
for(let i=0;i<3;i++){ const f = new THREE.Mesh(new THREE.BoxGeometry(0.42,0.015,0.3), mat(0xFFFFFF)); f.position.set(11.95,0.85+i*0.018,7.35); scene.add(f); pilha.push(f); }
relatorios = 3; contar();
requestAnimationFrame(quadro);
})();
</script>
